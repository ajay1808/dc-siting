# =============================================================================
# SITING SUITABILITY SCORING MODEL
# =============================================================================
# Score is computed per H3 cell (res 7, ~5.16 km2) and is fully explainable:
# every cell carries its total score AND each factor subscore, so the map can
# always answer "why is this cell an 82?".
#
#   total = 100 * (sum(weight_i * subscore_i) / sum(weight_i)) * exclusion_mult
#
# All subscores are normalized 0..1. Weights need not sum to 1 (renormalized).
# Cells with no data for a factor drop that factor and renormalize, rather
# than scoring it zero -- absence of data is not evidence of unsuitability.
# =============================================================================

version: 1
grid:
  system: h3
  resolution: 7

# --- how a missing factor is handled -----------------------------------------
missing_data:
  policy: renormalize        # renormalize | zero | neutral
  min_factors_required: 6    # below this, cell scored null (shown grey)

# --- exclusions: applied AFTER weighting, as a multiplier --------------------
exclusions:
  protected_lands:
    mode: hard
    multiplier: 0.0
    reason: Federal protected land / designated critical habitat
  flood_zones:
    mode: soft
    multiplier: 0.25
    reason: FEMA 100-year floodplain
  military_land:
    mode: hard
    multiplier: 0.0
    flag_at: 0.5
    reason: >
      DoD installation footprint. Applied to the boundary only, not the
      surroundings - proximity to a base is not inherently bad for a data
      center, being inside one is disqualifying.

  land_cover_wetland:
    mode: soft
    multiplier: 0.15
    threshold: 0.5
    reason: >
      Majority true wetland. Clean Water Act section 404 permitting through
      USACE makes a large pad impractical. Soft rather than hard: at 5 km2 a
      cell that is 60% wetland may still hold a buildable parcel. Open water
      is deliberately NOT included - riverfront is desirable for cooling, and
      including it scored an operating Columbia River campus at zero.

# --- flags: surfaced in the UI, never folded into the score ------------------
flags:
  - id: tribal_jurisdiction
    source: tribal_lands
    label: Tribal land - sovereignty & consultation required
  - id: ej_screening
    source: county_demographics
    field: pct_poverty
    threshold: 20
    label: Elevated poverty rate - environmental justice review indicated
  - id: high_water_stress
    source: water_stress
    field: bws_score
    threshold: 4
    label: Extremely high baseline water stress
  - id: active_moratorium
    source: policy_climate
    field: moratoria_active
    comparison: below      # rubric scores 100 = no moratoria, so low = flag
    threshold: 30          # median state is 35; 30 keeps the flag selective
    label: Active local data center moratorium reported

# --- factors -----------------------------------------------------------------
# Default profile is tuned for large-footprint AI/HPC campuses, where power
# availability dominates and latency barely matters. See `profiles` below.
factors:

  grid_access:
    label: Transmission & Substation Access
    weight: 0.1089
    inputs: [transmission_lines, substations]
    combine: max          # nearest good interconnect governs

  grid_headroom:
    label: Interconnection Headroom
    weight: 0.1558
    inputs: [interconnection_queue]
    note: Queue capacity nearby is the strongest available proxy for whether
          new large load can actually be energized this decade.

  power_cost:
    label: Industrial Power Cost
    weight: 0.1433
    inputs: [retail_power_price]

  cooling_efficiency:
    label: Cooling Climate
    weight: 0.0150
    inputs: [cooling_climate]
    note: Design wet-bulb sets achievable PUE and annual water draw.

  network_latency:
    label: IXP Proximity
    weight: 0.0150
    inputs: [ixp]

  water_availability:
    label: Water Availability
    weight: 0.0163
    inputs: [water_stress, water_treatment]
    combine: mean

  buildability:
    label: Terrain & Land Cover
    weight: 0.1317
    inputs: [slope, land_cover]
    combine: product      # steep AND forested is much worse than either alone

  policy_climate:
    label: Policy & Incentive Climate
    weight: 0.0726
    inputs: [policy_climate]

  hazard:
    label: Natural Hazard Exposure
    weight: 0.0342
    inputs: [hazard_nri, seismic, wildfire_risk]
    combine: min          # worst hazard governs; manual rasters refine NRI

  retirement_opportunity:
    label: Brownfield Interconnection
    weight: 0.0161
    inputs: [retirement_opportunity]
    note: Retiring thermal plants leave an energised point of interconnection
          with transmission already sized. Currently the fastest route to
          large load in the US.

  air_permitting:
    label: Air Permitting Headroom
    weight: 0.0674
    inputs: [air_permitting]
    note: Nonattainment status governs how hard it is to permit the 50-200 MW
          of backup generation a campus needs. Rarely mapped, often decisive.

  grid_carbon:
    label: Grid Carbon Intensity
    weight: 0.0150
    inputs: [grid_carbon]
    note: eGRID subregion CO2e per MWh before any PPA. Sets how much clean
          procurement a corporate commitment will require.

  generation_proximity:
    label: Generation Proximity
    weight: 0.0553
    inputs: [power_plants]
    note: Nearby installed capacity. Overlaps grid_access by design but is
          distinct - a plant next door is not the same as a 500kV line.

  market_maturity:
    label: Existing DC Cluster
    weight: 0.0566
    inputs: [existing_datacenters]

  gas_access:
    label: Natural Gas Access
    weight: 0.0352
    inputs: [gas_pipelines]

  clean_power_potential:
    label: Renewable Resource
    weight: 0.0150
    inputs: [solar_wind_potential]

  network_infrastructure:
    label: Broadband Infrastructure
    weight: 0.0155
    inputs: [broadband_served]

  logistics:
    label: Highway Access
    weight: 0.0311
    inputs: [rail_highway]

# --- alternative weightings ---------------------------------------------------
# Same subscores, different weights. Recomputed client-side from the baked
# per-factor values, so switching profiles is instant and needs no re-tiling.
profiles:

  ai_training:
    label: AI / HPC Training Campus
    description: Power-dominant. Latency is nearly irrelevant; cooling and
                 interconnection headroom dominate.
    weights:
      grid_access: 0.1376
      generation_proximity: 0.0344
      grid_headroom: 0.1548
      power_cost: 0.1032
      cooling_efficiency: 0.1032
      water_availability: 0.0774
      buildability: 0.0602
      policy_climate: 0.0602
      hazard: 0.043
      gas_access: 0.0344
      clean_power_potential: 0.0344
      network_latency: 0.0172
      market_maturity: 0.0
      network_infrastructure: 0.0
      logistics: 0.0
      retirement_opportunity: 0.06
      air_permitting: 0.05
      grid_carbon: 0.03

  edge_latency:
    label: Edge / Latency-Sensitive
    description: Proximity to population and exchanges dominates; raw power
                 scale matters much less.
    weights:
      network_latency: 0.2632
      generation_proximity: 0.0
      market_maturity: 0.1504
      network_infrastructure: 0.1128
      grid_access: 0.1128
      power_cost: 0.0752
      buildability: 0.0564
      policy_climate: 0.0564
      hazard: 0.047
      water_availability: 0.0282
      cooling_efficiency: 0.0188
      logistics: 0.0188
      grid_headroom: 0.0
      gas_access: 0.0
      clean_power_potential: 0.0
      retirement_opportunity: 0.02
      air_permitting: 0.03
      grid_carbon: 0.01

  sustainable:
    label: Low-Impact / Sustainability-Weighted
    description: Penalizes water stress and rewards renewable resource and
                 cool climate. For siting under corporate ESG constraints.
    weights:
      water_availability: 0.144
      cooling_efficiency: 0.128
      clean_power_potential: 0.112
      grid_access: 0.08
      generation_proximity: 0.016
      grid_headroom: 0.08
      buildability: 0.064
      hazard: 0.048
      policy_climate: 0.048
      power_cost: 0.032
      network_latency: 0.032
      gas_access: 0.0
      market_maturity: 0.016
      network_infrastructure: 0.0
      logistics: 0.0
      retirement_opportunity: 0.04
      air_permitting: 0.06
      grid_carbon: 0.1
