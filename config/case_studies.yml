# =============================================================================
# CALIBRATION CASE STUDIES
# =============================================================================
# Ground truth for fitting the default weighting. Weights are otherwise just
# my opinion; these make the model answerable to reality.
#
# POSITIVES are operating or under-construction large campuses - sites where
# real capital was committed after real diligence. They should score near
# `target_positive`.
#
# NEGATIVES are the important half. With positives alone an optimiser simply
# inflates whatever the positives happen to score well on. Each negative names
# WHY it is bad, and they are chosen to be individually instructive:
#   - dense urban   -> superficially great infra, no room (the Manhattan case)
#   - protected     -> exclusion sanity check
#   - remote        -> no grid, no fiber, nothing
#   - hazard/terrain-> unbuildable or uninsurable
# =============================================================================

targets:
  positive: 80      # a proven campus should land here
  negative: 22      # a clearly wrong site should land here
  # Regularisation toward the hand-set prior. 0 = pure data fit (overfits
  # badly with ~40 points and 15 factors), 1 = ignore the data entirely.
  prior_strength: 0.45   # raised: 0.25 let the fit zero out real factors

