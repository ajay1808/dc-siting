name: Deploy Siting Map to Pages

# Deploy-only by design. The data pipeline is NOT run here: it pulls a 261 MB
# Aqueduct archive, a 54 MB NOAA archive, NLCD WMS tiles and a CONUS DEM, and
# it queries Overpass, which throttled to the point of taking two hours for a
# single layer locally. That is too fragile and too rude to a public API to run
# on a monthly cron. Refresh locally with `make all`, commit the tiles, push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Pages size limits
        run: |
          # 100 MB per file, 1 GB per site. Fail loudly rather than shipping
          # something that 404s at runtime.
          fail=0
          shopt -s nullglob
          for f in web/tiles/*.pmtiles; do
            mb=$(( $(stat -c%s "$f") / 1000000 ))
            echo "$f = ${mb} MB"
            [ "$mb" -ge 100 ] && { echo "::error::$f exceeds the 100 MB limit"; fail=1; }
          done
          total=$(du -sm web | cut -f1)
          echo "site total = ${total} MB"
          [ "$total" -ge 1000 ] && { echo "::error::site exceeds 1 GB"; fail=1; }
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
