# =============================================================================
# DATA CENTER SITING — SOURCE REGISTRY
# =============================================================================
# Declarative manifest of every data layer. The pipeline reads ONLY this file
# to know what to fetch, how to normalize it, and how it feeds the score.
#
# tier:    easy | medium | hard      (hard = modeled, deferred to V2)
# phase:   1 | 2                     (V1 = easy + medium)
# auth:    none | api_key | account  (see docs/ACCOUNTS.md)
# role:    display  -> drawn on the map
#          score    -> feeds the suitability score
#          exclude  -> hard mask (score forced to 0 / flagged unbuildable)
#          context  -> shown + disclosed, deliberately NOT scored
# verify:  endpoints are checked by `pipeline/check.py` before any fetch.
# =============================================================================

meta:
  grid:
    system: h3
    resolution: 7          # ~5.16 km2/cell, ~1.22 km edge, ~1.57M cells CONUS
    drilldown_resolution: 8  # ~0.74 km2, enabled per-state on demand
    extent: conus            # conus | conus_ak_hi
  crs_working: EPSG:5070    # NAD83 / Conus Albers - equal area, meters
  crs_output: EPSG:4326

# =============================================================================
# ENERGY / GRID  — the dominant siting constraint
# =============================================================================
layers:

  - id: transmission_lines
    name: Electric Transmission Lines
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: line
    auth: account          # HIFLD Open access has tightened; EIA is the fallback
    license: US Federal / public domain
    cadence: quarterly
    endpoints:
      - name: eia_energy_atlas
        url: https://atlas.eia.gov/datasets/eia::electric-power-transmission-lines/about
        format: page
        primary: true
      - name: hifld
        url: https://hifld-geoplatform.opendata.arcgis.com/datasets/electric-power-transmission-lines
        format: page
      - name: osm_fallback
        url: overpass
        query: 'way["power"="line"]'
        format: overpass
    fields: [VOLTAGE, VOLT_CLASS, OWNER, STATUS, TYPE]
    scoring:
      factor: grid_access
      direction: positive
      method: distance_decay
      # voltage-weighted: a 500kV line is worth far more than a 69kV line
      weight_field: VOLTAGE
      # NOTE: weighting is percentile-normalised against the 95th percentile in
      # score.py, not a lookup curve. A weight_curve key used to sit here and
      # was never read by any code -- documentation of behaviour that did not
      # exist. Removed rather than left to mislead.
      decay_km: 15
      max_km: 40

  - id: substations
    name: Electric Substations
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: account
    license: US Federal / public domain
    cadence: quarterly
    endpoints:
      - name: eia_energy_atlas
        url: https://atlas.eia.gov/datasets/eia::electric-substations/about
        format: page
        primary: true
      - name: hifld
        url: https://hifld-geoplatform.opendata.arcgis.com/datasets/substations
        format: page
    fields: [NAME, MAX_VOLT, MIN_VOLT, TYPE, STATUS, LINES]
    scoring:
      factor: grid_access
      direction: positive
      method: distance_decay
      weight_field: MAX_VOLT
      untagged_weight: 0.25   # OSM untagged skews small; do not assume median
      decay_km: 10
      max_km: 30

  - id: interconnection_queue
    name: Generator Interconnection Queue
    category: energy
    tier: medium
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: LBNL / CC BY 4.0
    cadence: annual
    note: >
      THE binding constraint on US data center development right now. Queue
      depth and wait time near a site predicts whether new load can actually
      be energized. The commercial equivalent does not have this layer.
    endpoints:
      - name: lbnl_queued_up
        url: https://emp.lbl.gov/generation-storage-and-hybrid-capacity
        format: page
        primary: true
    fields: [q_status, q_year, capacity_mw, fuel, state, county, poi_name]
    scoring:
      factor: grid_headroom
      direction: positive
      method: capacity_within_radius
      value_field: capacity_mw
      radius_km: 50
      # Explicit so the scale cannot drift between refreshes. Without it the
      # normaliser used the observed 97th percentile, so one new gigawatt-scale
      # project silently restated every other cell's headroom score.
      clamp_total_mw: [0, 6000]

  - id: balancing_authorities
    name: Balancing Authority Territories
    category: energy
    tier: easy
    phase: 1
    role: [display, context]
    geometry: polygon
    auth: none
    license: US Federal / public domain
    cadence: annual
    endpoints:
      - name: eia_ba
        url: https://atlas.eia.gov/datasets/eia::balancing-authorities/about
        format: page
    fields: [NAME, ABBREV, REGION]

  - id: electric_territories
    name: Electric Utility Service Territories
    category: energy
    tier: easy
    phase: 1
    role: [display, context]
    geometry: polygon
    auth: account
    license: US Federal / public domain
    cadence: annual
    endpoints:
      - name: hifld
        url: https://hifld-geoplatform.opendata.arcgis.com/datasets/electric-retail-service-territories
        format: page
    fields: [NAME, TYPE, CNTRL_AREA, HOLDING_CO]

  - id: retail_power_price
    name: Retail Electricity Price (Industrial)
    category: energy
    tier: medium
    phase: 1
    role: [score]
    geometry: join_state
    auth: api_key
    api_key_env: EIA_API_KEY
    license: US Federal / public domain
    cadence: monthly
    note: >
      Industrial rate, cents/kWh. Ideally joined to utility service territory,
      but those polygons are in the restricted HIFLD set, so V1 joins at state
      level. Coarse but free and honest; intrastate spread is not captured.
    endpoints:
      - name: eia_861
        url: https://api.eia.gov/v2/electricity/retail-sales/data/
        format: json_api
        params: {frequency: monthly, "data[]": price, "facets[sectorid][]": IND}
    scoring:
      factor: power_cost
      direction: negative     # lower price = better
      method: normalize_invert
      clamp: [4.0, 20.0]      # cents/kWh

  - id: power_plants
    name: Power Plants (All Sources)
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: api_key
    api_key_env: EIA_API_KEY
    license: US Federal / public domain
    cadence: monthly
    endpoints:
      - name: eia_860m
        url: https://www.eia.gov/electricity/data/eia860m/
        format: xlsx
        primary: true
      - name: eia_atlas
        url: https://atlas.eia.gov/datasets/eia::power-plants/about
        format: page
    fields: [plant_name, plant_code, capacity_mw, technology, sector, status]
    scoring:
      factor: generation_proximity
      direction: positive
      method: capacity_within_radius
      value_field: capacity_mw
      radius_km: 40
      clamp_total_mw: [0, 12000]

  - id: gas_pipelines
    name: Natural Gas Transmission Pipelines
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: line
    auth: none
    license: US Federal / public domain
    cadence: annual
    note: Enables on-site generation / bridge power, increasingly common for DCs.
    endpoints:
      - name: eia_atlas
        url: https://atlas.eia.gov/datasets/eia::natural-gas-interstate-and-intrastate-pipelines/about
        format: page
    scoring:
      factor: gas_access
      direction: positive
      method: distance_decay
      decay_km: 20
      max_km: 50

# =============================================================================
# NETWORK / CONNECTIVITY
# =============================================================================

  - id: ixp
    name: Internet Exchange Points
    category: network
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: account
    api_key_env: PEERINGDB_API_KEY
    license: PeeringDB / CC BY 4.0
    cadence: monthly
    note: >
      Latency to a major IXP is a first-order siting factor and PeeringDB is a
      clean free API. The commercial equivalent has no IXP layer. High-value, low-effort addition.
    endpoints:
      - name: peeringdb_ix
        url: https://www.peeringdb.com/api/ix
        format: json_api
      - name: peeringdb_fac
        url: https://www.peeringdb.com/api/fac
        format: json_api
    fields: [name, city, state, net_count, latitude, longitude]
    scoring:
      factor: network_latency
      direction: positive
      method: distance_decay
      weight_field: net_count      # bigger exchange = more valuable
      decay_km: 80
      max_km: 400

  - id: broadband_served
    name: Broadband Service Availability
    category: network
    tier: medium
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: US Federal / public domain
    cadence: semiannual
    note: FCC BDC bulk files are very large; we aggregate to county then to cells.
    endpoints:
      - name: fcc_bdc
        url: https://broadbandmap.fcc.gov/data-download
        format: page
    fields: [pct_connected]
    scoring:
      factor: network_infrastructure
      direction: positive
      method: normalize
      value_field: pct_connected
      clamp: [55, 95]
    substitution: >
      FCC BDC has no scripted access path (403/405 on every public endpoint),
      so this uses ACS B28002 household internet subscription. That is
      adoption, not availability, and understates areas with good
      infrastructure but low uptake.

  - id: existing_datacenters
    name: Existing Data Centers
    category: network
    tier: medium
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: ODbL (OpenStreetMap)
    cadence: monthly
    note: >
      Dual signal: clustering proves the fundamentals work (power, fiber,
      permitting), but saturation means grid contention. Scored as a tuned
      optimum, not monotonic.
    endpoints:
      - name: osm_overpass
        url: overpass
        query: 'nwr["telecom"="data_center"];nwr["building"="data_center"]'
        format: overpass
    scoring:
      factor: market_maturity
      direction: optimum
      method: count_within_radius
      radius_km: 50
      optimum_count: 5        # some neighbours good, many = contention
      falloff: 20

# =============================================================================
# WATER
# =============================================================================

  - id: water_stress
    name: Baseline Water Stress (Aqueduct)
    category: water
    tier: easy
    phase: 1
    role: [display, score]
    geometry: polygon
    auth: none
    license: WRI Aqueduct 4.0 / CC BY 4.0
    cadence: annual
    endpoints:
      - name: wri_aqueduct
        url: https://www.wri.org/data/aqueduct-global-maps-40-data
        format: page
    fields: [bws_score, bws_cat, bwd_score, iav_score]
    scoring:
      factor: water_availability
      direction: negative
      method: normalize_invert
      value_field: bws_score
      clamp: [0, 5]

  - id: drought
    name: US Drought Monitor
    category: water
    tier: easy
    phase: 1
    role: [display, context]
    geometry: polygon
    auth: none
    license: Public domain
    cadence: weekly
    endpoints:
      - name: usdm
        url: https://droughtmonitor.unl.edu/DmData/GISData.aspx
        format: page

  - id: water_use
    name: County Water Withdrawals
    category: water
    tier: medium
    phase: 1
    role: [score]
    geometry: join_county
    auth: none
    license: US Federal / public domain
    cadence: quinquennial
    endpoints:
      - name: usgs_water_use
        url: https://water.usgs.gov/watuse/data/
        format: page
    scoring:
      factor: water_availability
      direction: context

  - id: water_treatment
    name: Wastewater Treatment Facilities
    category: water
    tier: medium
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: US Federal / public domain
    cadence: annual
    note: Reclaimed water is the preferred DC cooling source; proximity matters.
    endpoints:
      - name: epa_echo
        url: https://echo.epa.gov/tools/data-downloads
        format: page
    scoring:
      factor: water_availability
      direction: positive
      method: distance_decay
      decay_km: 15
      max_km: 40

# =============================================================================
# CLIMATE / COOLING  — drives PUE and water draw. Absent from the commercial equivalent entirely.
# =============================================================================

  - id: cooling_climate
    name: Cooling Degree Days & Wet-Bulb Temperature
    category: climate
    tier: medium
    phase: 1
    role: [display, score]
    geometry: raster_to_cell
    auth: none
    license: NOAA / public domain
    cadence: annual
    note: >
      Highest-leverage layer the commercial equivalent is missing. Design wet-bulb determines whether
      free cooling / evaporative cooling works, which sets both PUE and annual
      water consumption. Cool dry climates are structurally advantaged.
    endpoints:
      - name: noaa_normals
        url: https://www.ncei.noaa.gov/access/us-climate-normals/
        format: page
      - name: noaa_climate_grid
        url: https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/
        format: page
    fields: [cdd65, tavg]
    scoring:
      factor: cooling_efficiency
      direction: negative
      method: idw_invert       # station point data, interpolated to cells
      value_field: cdd65
      clamp: [200, 4000]       # annual cooling degree days, base 65F
      k: 6
    substitution: >
      Design wet-bulb (ASHRAE) is paywalled; annual CDD is the free proxy.
      Tracks cooling energy well but ignores humidity, so arid and humid
      sites with equal CDD score the same when they should not.

  - id: solar_wind_potential
    name: Solar & Wind Resource Potential
    category: climate
    tier: medium
    phase: 1
    role: [display, score]
    geometry: raster_to_cell
    auth: api_key
    api_key_env: NREL_API_KEY
    license: NREL / public domain
    cadence: static
    endpoints:
      - name: nlr_solar
        url: https://developer.nlr.gov/api/solar/solar_resource/v1.json
        format: json_api
      - name: nlr_docs
        url: https://developer.nlr.gov/docs/solar/nsrdb/
        format: json_api
    scoring:
      factor: clean_power_potential
      direction: positive
      method: idw
      value_field: ghi
      clamp: [3.2, 6.2]     # kWh/m2/day annual GHI across CONUS
      k: 4

# =============================================================================
# HAZARD / EXCLUSION  — hard masks
# =============================================================================

  - id: flood_zones
    name: FEMA Flood Hazard Zones
    category: hazard
    tier: medium
    phase: 1
    role: [display, exclude]
    geometry: polygon
    auth: none
    license: US Federal / public domain
    cadence: continuous
    note: >
      National NFHL is ~30GB. Pipeline fetches state-by-state and discards raw
      after rasterizing to cells - required given local disk headroom.
    endpoints:
      - name: fema_nfhl
        url: https://msc.fema.gov/portal/advanceSearch
        format: page
      - name: fema_nfhl_rest
        url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer
        format: arcgis_rest
    exclusion:
      field: FLD_ZONE
      values: [A, AE, AH, AO, AR, A99, V, VE]
      mode: soft            # penalize heavily rather than hard-zero
      penalty: 0.75

  - id: hazard_nri
    name: Multi-Hazard Risk (FEMA National Risk Index)
    category: hazard
    tier: easy
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: FEMA / public domain
    cadence: annual
    note: >
      Single public federal source covering earthquake, wildfire, flood,
      hurricane, tornado, landslide, ice storm and heat wave. Used because
      USFS blocks scripted clients (403) and USGS exposes seismic only as
      contour arcs. Weighted so siting-relevant hazards (quake, flood, fire)
      count more than design-solvable ones (tornado, hail).
    endpoints:
      - name: fema_nri_counties
        url: https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/National_Risk_Index_Counties/FeatureServer/0
        format: arcgis_rest
    scoring:
      factor: hazard
      direction: negative
      method: normalize_invert
      value_field: hazard_index
      # Was [0,60], which pinned 13.4% of counties at exactly 0 -- all of
      # hurricane Florida and wildfire California collapsed to one value and
      # became indistinguishable. NRI runs to 93.
      clamp: [0, 95]

  - id: air_permitting
    name: Air Permitting Burden (EPA Nonattainment)
    category: regulatory
    tier: easy
    phase: 1
    role: [display, score]
    geometry: polygon
    auth: none
    license: EPA / public domain
    cadence: quarterly
    note: >
      A hyperscale campus needs 50-200 MW of diesel or gas backup generation.
      Inside a nonattainment area that plant triggers New Source Review, may
      require emission offsets bought in the same airshed, and faces hard caps
      on annual test-run hours. Severity is weighted by classification
      (Extreme..Marginal) and by whether the pollutant is one backup gensets
      actually emit -- ozone precursors and PM matter, lead and SO2 barely do.
      Maintenance areas count at 45% of the equivalent nonattainment burden.
    endpoints:
      - name: epa_greenbook_gis
        url: https://services.arcgis.com/cJ9YHowT8TU7DUyn/ArcGIS/rest/services/Nonattainment_Areas_and_Designations/FeatureServer/0
        format: arcgis_rest
    scoring:
      factor: air_permitting
      direction: negative
      method: normalize_invert
      value_field: permit_difficulty
      clamp: [0, 1]
      # No designation means attainment, which is the BEST case, not missing
      # data. Only ~9% of CONUS sits inside a designated area.
      fill_missing: 0.0

  - id: grid_carbon
    name: Grid Carbon Intensity (eGRID)
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: polygon
    auth: none
    license: EPA / public domain
    cadence: annual
    note: >
      CO2-equivalent output rate of the grid subregion, lb/MWh, before any
      power purchase agreement. Sets how much clean procurement a corporate
      commitment needs and is increasingly part of whether a project is
      approvable. Spans roughly 430 (WECC California) to 1,400+ lb/MWh.
    endpoints:
      - name: egrid_data
        url: https://www.epa.gov/system/files/documents/2025-06/egrid2023_data_rev2.xlsx
        format: xlsx
      - name: egrid_subregions
        url: https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services/eGRID2023_Subregions/FeatureServer/0
        format: arcgis_rest
    scoring:
      factor: grid_carbon
      direction: negative
      method: normalize_invert
      value_field: co2e_lb_mwh
      clamp: [400, 1500]

  - id: retirement_opportunity
    name: Brownfield Interconnection (Retiring Generation)
    category: energy
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: US Federal / public domain
    cadence: monthly
    note: >
      A retiring thermal plant leaves an energised point of interconnection
      with transmission already sized for its former output. Re-using that POI
      is currently the fastest route to large load in the US. Capacity is
      weighted by recency -- a plant retired in the 1990s has usually had its
      interconnection rights released.
    endpoints:
      - name: eia_860m_retired
        url: https://www.eia.gov/electricity/data/eia860m/
        format: xlsx
    scoring:
      factor: retirement_opportunity
      direction: positive
      method: capacity_within_radius
      value_field: capacity_mw
      radius_km: 45
      clamp_total_mw: [0, 4000]

  - id: military_land
    name: Military Installations
    category: jurisdiction
    tier: easy
    phase: 1
    role: [display, exclude]
    geometry: polygon
    auth: none
    license: US Federal / public domain
    cadence: annual
    note: >
      Installation footprints are not developable. Applied to the footprint
      only, not the surroundings: proximity to a base is not inherently bad for
      a data center, being inside one is disqualifying.
    endpoints:
      - name: dod_installations
        url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/Military_Installations_byBranch/FeatureServer/0
        format: arcgis_rest

  - id: iso_queue
    name: ISO Interconnection Queue - active supply (consolidated)
    category: energy
    tier: medium
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: ISO public data via gridstatus (BSD-3)
    cadence: monthly
    note: >
      All seven ISO generation queues consolidated directly with the open-source
      gridstatus library, replacing reliance on LBNL (which blocks scripted
      access). Active queued MW per county: supply that could serve co-located
      load, and a signal planners expect injection there. PJM requires a free
      PJM_API_KEY. Non-ISO regions (Southeast, much of the West) have no data
      and drop out rather than reading as zero.
    endpoints:
      - name: gridstatus
        url: https://github.com/gridstatus/gridstatus
        format: python
    scoring:
      factor: grid_headroom
      direction: positive
      method: normalize
      value_field: active_mw
      transform: log1p
      clamp: [0, 10.0]          # log1p(MW); 10.0 ~= 22 GW

  - id: iso_queue_friction
    name: ISO Interconnection Queue - withdrawal rate
    category: energy
    tier: medium
    phase: 1
    role: [score]
    geometry: join_county
    data_from: iso_queue
    auth: none
    license: ISO public data via gridstatus (BSD-3)
    cadence: monthly
    note: >
      Share of queued projects ever withdrawn, shrunk toward the ISO-wide rate
      (prior strength 8 projects) so a county with two projects cannot read as
      0% or 100%. High withdrawal is the fingerprint of expensive network
      upgrades.
    endpoints:
      - name: gridstatus
        url: https://github.com/gridstatus/gridstatus
        format: python
    scoring:
      factor: interconnection_friction
      direction: negative
      method: normalize_invert
      value_field: withdrawn_share
      clamp: [0.40, 0.95]

  - id: utility_price
    name: Industrial Price by Retail Utility (EIA-861)
    category: energy
    tier: medium
    phase: 1
    role: [display, score]
    geometry: polygon
    auth: none
    license: US Federal / public domain
    cadence: annual
    note: >
      Replaces the state-average price. EIA-861 industrial revenue / sales per
      utility, drawn on HIFLD retail service territories by EIA utility ID.
      Overlaps burn the higher price (conservative). An average realised
      industrial price, not a negotiated large-load tariff; matters less in
      retail-choice states where a campus buys at wholesale.
    endpoints:
      - name: eia861
        url: https://www.eia.gov/electricity/data/eia861/
        format: zip
      - name: territories
        url: https://services6.arcgis.com/BAJNi3EgCdtQ1BCG/arcgis/rest/services/Electric_Retail_Service_Territories/FeatureServer/0
        format: arcgis_rest
    scoring:
      factor: power_cost
      direction: negative
      method: normalize_invert
      value_field: cents_kwh
      clamp: [4.0, 20.0]

  - id: labor_pool
    name: Skilled Trades & DC Workforce (Census CBP)
    category: socioeconomic
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: api_key
    api_key_env: CENSUS_API_KEY
    license: US Census / public domain
    cadence: annual
    note: >
      Electrical contractors, power-line construction, mechanical contractors
      and existing hosting workforce, weighted by how directly each gates a
      build, summed within commuting distance of each cell.
    endpoints:
      - name: census_cbp
        url: https://api.census.gov/data/2022/cbp
        format: json_api
    scoring:
      factor: labor
      direction: positive
      method: capacity_within_radius
      value_field: weighted_workers
      radius_km: 80
      clamp_total_mw: [0, 60000]   # weighted workers within 80 km

  - id: reclaimed_water
    name: Reclaimed Water Supply (EPA ECHO major POTWs)
    category: water
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: EPA / public domain
    cadence: quarterly
    note: >
      Treated municipal effluent is the preferred cooling source for large
      campuses because it does not compete with drinking water, which is where
      most local opposition to data center water use starts.
    endpoints:
      - name: epa_echo_cwa
        url: https://echodata.epa.gov/echo/cwa_rest_services.get_facilities
        format: json_api
    scoring:
      factor: water_availability
      direction: positive
      method: capacity_within_radius
      value_field: flow_mgd
      radius_km: 25
      clamp_total_mw: [0, 300]     # MGD within radius

  - id: drought_frequency
    name: Drought Frequency 2016-2025 (US Drought Monitor)
    category: water
    tier: easy
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: NDMC / public
    cadence: weekly
    note: >
      Average share of the county in D2+ drought across ten years of weekly
      maps. A decade, not this week, because the asset lives for thirty years.
    endpoints:
      - name: usdm_county_stats
        url: https://usdmdataservices.unl.edu/api/CountyStatistics/
        format: csv_api
    scoring:
      factor: water_availability
      direction: negative
      method: normalize_invert
      value_field: pct_area_severe_drought
      clamp: [0, 40]

  - id: water_stress_future
    name: Projected Water Stress 2050 (WRI Aqueduct, BAU)
    category: water
    tier: easy
    phase: 1
    role: [display, score]
    geometry: polygon
    auth: none
    license: WRI / CC BY 4.0
    cadence: static
    note: Same basins as the baseline layer, projected to 2050 business-as-usual.
    endpoints:
      - name: wri_aqueduct
        url: https://files.wri.org/aqueduct/aqueduct-4-0-water-risk-data.zip
        format: zip
    scoring:
      factor: water_availability
      direction: negative
      method: normalize_invert
      value_field: ws_2050
      clamp: [0, 5]

  - id: climate_future
    name: Projected Cooling Degree Days 2036-2065 (CMRA, RCP4.5)
    category: climate
    tier: easy
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: NOAA/USGS / public domain
    cadence: static
    note: >
      LOCA-downscaled county projections from the federal Climate Mapping for
      Resilience and Adaptation portal. RCP4.5 is a middle scenario, not the
      worst case. Replaces historical normals as the primary cooling signal.
    endpoints:
      - name: cmra
        url: https://resilience.climate.gov/
        format: arcgis_rest
    scoring:
      factor: cooling_efficiency
      direction: negative
      method: normalize_invert
      value_field: cdd_2050
      clamp: [200, 5000]

  - id: heat_days
    name: Days Above 95F by Mid-Century (CMRA, RCP4.5)
    category: climate
    tier: easy
    phase: 1
    role: [display, score]
    geometry: join_county
    data_from: climate_future
    auth: none
    license: NOAA/USGS / public domain
    cadence: static
    note: >
      Peak heat, not average heat. Governs how much cooling plant has to be
      sized for the design day, and coincides with grid peak -- the hours a
      campus is most likely to be asked to curtail.
    endpoints:
      - name: cmra
        url: https://resilience.climate.gov/
        format: arcgis_rest
    scoring:
      factor: extreme_heat
      direction: negative
      method: normalize_invert
      value_field: days95_2050
      clamp: [0, 120]

  - id: land_cost
    name: Land Price per Acre (FHFA)
    category: socioeconomic
    tier: easy
    phase: 1
    role: [display, score]
    geometry: join_county
    auth: none
    license: FHFA / public domain
    cadence: annual
    note: >
      Appraisal-based residential land value per acre. A relative signal only:
      campuses buy industrial or agricultural land that is usually much cheaper
      per acre, but where housing land is expensive, all land is.
    endpoints:
      - name: fhfa_land_prices
        url: https://www.fhfa.gov/research/papers/wp1901
        format: xlsx
    scoring:
      factor: land_cost
      direction: negative
      method: normalize_invert
      value_field: land_usd_acre
      transform: log1p
      clamp: [8.5, 14.0]           # log1p($/acre): ~$5k to ~$1.2M

  - id: cable_landings
    name: Submarine Cable Landing Stations
    category: network
    tier: easy
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: TeleGeography open map data (CC BY-SA)
    cadence: quarterly
    endpoints:
      - name: submarinecablemap
        url: https://www.submarinecablemap.com/api/v3/landing-point/landing-point-geo.json
        format: geojson
    scoring:
      factor: network_latency
      direction: positive
      method: distance_decay
      decay_km: 60
      max_km: 250

  - id: rail_corridors
    name: Class I Rail Main Lines (fiber right-of-way proxy)
    category: network
    tier: medium
    phase: 1
    role: [display, score]
    geometry: line
    auth: none
    license: BTS NTAD / public domain
    cadence: annual
    note: >
      The InterTubes study (Durairajan et al., SIGCOMM 2015) found US long-haul
      fiber runs overwhelmingly inside rail and highway rights-of-way. A proxy
      for where long-haul routes are, not a map of them.
    endpoints:
      - name: ntad_rail
        url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_North_American_Rail_Network_Lines/FeatureServer/0
        format: arcgis_rest
    scoring:
      factor: fiber_corridors
      direction: positive
      method: distance_decay
      decay_km: 12
      max_km: 40

  - id: nodal_lmp
    name: Nodal Wholesale Price (CAISO / WEIM day-ahead)
    category: energy
    tier: hard
    phase: 1
    role: [display, score]
    geometry: point
    auth: none
    license: CAISO OASIS public data via gridstatus
    cadence: monthly
    note: >
      Average day-ahead LMP at every CAISO and Western EIM node, 24 sample days
      across the past year. Node coordinates from CAISO's public price-contour
      feed, joined by node name. West only for now; other ISOs need a node
      coordinate source.
    endpoints:
      - name: caiso_contour
        url: https://wwwmobile.caiso.com/Web.Service.Chart/api/v3/ChartService/PriceContourMap1
        format: json
      - name: caiso_oasis
        url: http://oasis.caiso.com/
        format: zip
    scoring:
      factor: wholesale_price
      direction: negative
      method: idw_invert
      value_field: lmp_mean
      k: 6
      max_km: 60
      # Set from the observed distribution (p5 $28.4, p95 $36.9). The first
      # guess of [15, 90] would have squeezed every node into ~15% of the scale.
      clamp: [26, 40]

  - id: nodal_congestion
    name: Transmission Congestion (CAISO / WEIM congestion component)
    category: energy
    tier: hard
    phase: 1
    role: [display, score]
    geometry: point
    data_from: nodal_lmp
    auth: none
    license: CAISO OASIS public data via gridstatus
    cadence: monthly
    note: >
      Signed average congestion component of LMP. Negative marks an
      export-constrained pocket -- surplus generation that cannot get out --
      which is where new load is most welcome and power is cheapest. Positive
      marks an import-constrained load pocket, where new load makes things
      worse and pays for it.
    endpoints:
      - name: caiso_oasis
        url: http://oasis.caiso.com/
        format: zip
    scoring:
      factor: transmission_congestion
      direction: negative
      method: idw_invert
      value_field: congestion_mean
      k: 6
      max_km: 60
      clamp: [-4, 4]             # observed p5 -3.1, p95 +2.1

  - id: seismic
    name: Seismic Hazard (PGA 2% in 50yr)
    category: hazard
    tier: medium
    phase: 1
    role: [display, score]
    geometry: raster_to_cell
    auth: none
    license: USGS / public domain
    cadence: static
    endpoints:
      - name: usgs_nshm
        url: https://www.usgs.gov/programs/earthquake-hazards/seismic-hazard-maps-and-site-specific-data
        format: page
    scoring:
      factor: hazard
      direction: negative
      method: normalize_invert

  - id: wildfire_risk
    name: Wildfire Risk
    category: hazard
    tier: medium
    phase: 1
    role: [display, score]
    geometry: raster_to_cell
    auth: none
    license: USFS / public domain
    cadence: annual
    endpoints:
      - name: usfs_wrc
        url: https://wildfirerisk.org/download/
        format: page
    scoring:
      factor: hazard
      direction: negative
      method: normalize_invert

# =============================================================================
# LAND / TERRAIN
# =============================================================================

  - id: slope
    name: Terrain Slope
    category: land
    tier: medium
    phase: 1
    role: [score]
    geometry: raster_to_cell
    auth: none
    license: USGS 3DEP / public domain
    cadence: static
    note: DC campuses need large flat pads. Slope >5% sharply raises sitework cost.
    endpoints:
      - name: usgs_3dep
        url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
        format: arcgis_rest
    scoring:
      factor: buildability
      direction: negative
      method: normalize_invert
      clamp: [0, 15]     # percent slope

  - id: land_cover
    name: Land Cover (NLCD)
    category: land
    tier: medium
    phase: 1
    role: [score]
    geometry: raster_to_cell
    auth: none
    license: USGS MRLC / public domain
    cadence: biennial
    endpoints:
      - name: mrlc_nlcd
        url: https://www.mrlc.gov/data
        format: page
    scoring:
      factor: buildability
      direction: positive
      method: normalize      # ingest already emits a 0-1 suitability raster
      clamp: [0, 1]
    note_model: >
      Scored on development cost and permitting risk, not on "developed vs
      not". Developed high-intensity is the WORST developed class (no room,
      expensive land); developed open space and low intensity are the best
      (already serviced and disturbed). Cultivated crops score well below
      pasture because prime-farmland conversion is the most locally contested
      change of use. Wetlands are an exclusion, not a low score.

  - id: protected_lands
    name: Protected Lands (Parks, Critical Habitat, ACEC)
    category: land
    tier: easy
    phase: 1
    role: [display, exclude]
    geometry: polygon
    auth: none
    license: US Federal / public domain
    cadence: annual
    endpoints:
      - name: padus
        url: https://www.usgs.gov/programs/gap-analysis-project/science/pad-us-data-download
        format: page
        primary: true
      - name: usfws_crithab
        url: https://ecos.fws.gov/ecp/report/table/critical-habitat.html
        format: page
      - name: blm_acec
        url: https://gbp-blm-egis.hub.arcgis.com/
        format: page
    exclusion:
      mode: hard
      note: Federal protected land and designated critical habitat are unbuildable.

  - id: brownfields
    name: EPA Brownfield & Superfund Sites
    category: land
    tier: medium
    phase: 1
    role: [display, context]
    geometry: point
    auth: none
    license: US Federal / public domain
    cadence: quarterly
    note: >
      Ambiguous signal - contamination is a liability, but brownfield
      redevelopment often carries large tax credits and pre-existing power
      service. Shown as context, not scored.
    endpoints:
      - name: epa_cleanups
        url: https://www.epa.gov/frs/geospatial-data-download-service
        format: page

  - id: rail_highway
    name: Rail & Interstate Access
    category: land
    tier: easy
    phase: 1
    role: [score]
    geometry: line
    auth: none
    license: BTS NTAD / public domain
    cadence: annual
    endpoints:
      - name: bts_ntad
        url: https://geodata.bts.gov/
        format: page
    scoring:
      factor: logistics
      direction: positive
      method: distance_decay
      weight_field: road_class
      decay_km: 15
      max_km: 50

# =============================================================================
# JURISDICTION / SOCIOECONOMIC
# =============================================================================

  - id: tribal_lands
    name: Tribal Lands (AIANNH)
    category: jurisdiction
    tier: easy
    phase: 1
    role: [display, context]
    geometry: polygon
    auth: none
    license: US Census / public domain
    cadence: annual
    note: >
      Modeled as a JURISDICTIONAL FLAG, not a score penalty. Development on or
      near tribal land is a sovereignty and consultation question, not a
      desirability question. The map surfaces it; it does not rank it.
    endpoints:
      - name: census_tiger_aiannh
        url: https://www2.census.gov/geo/tiger/TIGER2024/AIANNH/
        format: shapefile_dir

  - id: county_demographics
    name: County Demographics (ACS)
    category: socioeconomic
    tier: medium
    phase: 1
    role: [display, context]
    geometry: join_county
    auth: api_key
    api_key_env: CENSUS_API_KEY
    license: US Census / public domain
    cadence: annual
    note: >
      Poverty rate is carried as a DISCLOSURE / environmental-justice screening
      field, deliberately NOT as a positive scoring input. Treating low income
      as a siting advantage is precisely the pattern that generates EJ
      litigation and permit denials. Surfaced so it can be reviewed, never
      silently rewarded.
    endpoints:
      - name: census_acs5
        url: https://api.census.gov/data/2023/acs/acs5
        format: json_api
    fields: [pct_poverty, median_income, population, pct_unemployed]

  - id: opportunity_zones
    name: Qualified Opportunity Zones
    category: socioeconomic
    tier: easy
    phase: 1
    role: [display, context]
    geometry: polygon
    auth: none
    license: US Treasury / public domain
    cadence: static
    endpoints:
      - name: cdfi_oz
        url: https://www.cdfifund.gov/opportunity-zones
        format: page

# =============================================================================
# POLICY  — AI-assembled, see pipeline/policy_scan.py
# =============================================================================

  - id: policy_climate
    name: State Data Center Policy & Incentive Climate
    category: policy
    tier: medium
    phase: 1
    role: [display, score]
    geometry: join_state
    auth: api_key
    api_key_env: ANTHROPIC_API_KEY
    license: derived / cite-linked
    cadence: monthly
    note: >
      Structured per-state record built by an LLM research pass with mandatory
      source URLs. Every scored field must carry >=1 citation and a confidence
      value or it is dropped. Never scored from an uncited claim.
    fields:
      - sales_tax_exemption      # DC equipment sales/use tax exemption
      - property_tax_abatement
      - permitting_speed
      - moratoria_active         # active local moratoria on DC development
      - power_ratepayer_rules    # who pays for interconnection upgrades
      - water_restrictions
    scoring:
      factor: policy_climate
      direction: positive
      method: normalize
      value_field: policy_score
      clamp: [0, 100]
